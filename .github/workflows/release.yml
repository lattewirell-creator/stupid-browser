# Release from GitHub's own Windows machine: builds the Windows installer and publishes the GitHub Release that
# installed copies update from (scripts/release.sh, the same as `npm run release` off a Mac). Bump "version" in
# package.json on main first. Macs keep their version; the website's Mac download carries over. Run by hand from Actions.
name: Release (Windows)
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What's new (Markdown)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Electron itself (newer npm may skip its download)
        run: node node_modules/electron/install.js
      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: bash scripts/release.sh "$NOTES"
      # The installer people download: a calm window in the browser's look around the setup above (installer/).
      - name: Friendly installer
        # If this step fails the release is already out (and the Linux package still gets built).
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./installer/build.ps1
          $v = node -p "require('./package.json').version"
          gh release upload "v$v" release/StupidBrowser-Install.exe --clobber -R "${{ github.repository }}"
      - name: Warn if the friendly installer is missing
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = node -p "require('./package.json').version"
          $names = gh release view "v$v" -R "${{ github.repository }}" --json assets --jq '.assets[].name'
          if ($names -notcontains 'StupidBrowser-Install.exe') { Write-Host "::error::StupidBrowser-Install.exe is missing from v$v (the release is out; run installer/build.ps1 and upload it)" } else { "Friendly installer attached." }

  # The Linux package for the same version, attached to the release just published (Stupid OS installs and updates
  # the browser from it). A release made by this workflow doesn't start release-linux.yml, so it's built here.
  linux:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && node node_modules/electron/install.js && npm run dist:linux
      - name: Attach to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "v$(node -p "require('./package.json').version")" release/*-linux-amd64.deb --clobber -R "${{ github.repository }}"
