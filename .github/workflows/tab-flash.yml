# Do new tabs and tab switches flash black on Windows? Runs test/tab-flash.js in light and dark theme, on this
# commit ("after") and with main's tab code ("before"), and prints how many sampled frames were black.
name: Tab flash (Windows)
on:
  workflow_dispatch:
  push:
    branches: [fix/tab-flash]
jobs:
  flash:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: { variant: [before, after], theme: [light, dark] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Main's tab code
        if: matrix.variant == 'before'
        shell: bash
        run: git checkout origin/main -- src/renderer.js src/styles.css
      - name: Run
        shell: bash
        run: |
          D="$RUNNER_TEMP/profile"; mkdir -p "$D"; echo '{"theme":"${{ matrix.theme }}","onboarded":true}' > "$D/settings.json"
          export STUPID_SELFTEST="$RUNNER_TEMP/shot.png" STUPID_SELFTEST_SCRIPT="$PWD/test/tab-flash.js" STUPID_SELFTEST_STEPS="quit@20000" STUPID_SAMPLE_LOG="$RUNNER_TEMP/samples.txt" STUPID_TEST_FRONT=1
          timeout 90 node_modules/electron/dist/electron.exe . --user-data-dir="$D" || true
          echo "== ${{ matrix.variant }} / ${{ matrix.theme }}"; cat "$STUPID_SAMPLE_LOG"
