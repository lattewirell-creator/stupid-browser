# Builds the Linux package (.deb) and attaches it to the GitHub release. Stupid OS installs and updates
# The Stupid Browser from this file, found by its "-linux-amd64.deb" suffix, so keep that name.
name: Release (Linux)
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.release.tag_name || github.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run dist:linux
      - name: Attach to the release
        if: github.event_name == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" release/*-linux-amd64.deb --clobber -R "${{ github.repository }}"
      - name: Keep the package (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with: { name: stupid-browser-linux, path: release/*-linux-amd64.deb }
