# How quick is the browser on Windows? Starts it 4 times (the first is a cold start) and prints when the window
# appeared and the UI finished loading, then runs test/perf.js: new tabs, tab switches and scrolling a long page.
# "before" runs the app code (src/) of the base commit, "after" this commit, on the same machine.
name: Speed (Windows)
on:
  workflow_dispatch:
    inputs:
      base: { description: Commit to compare with, default: '' }
  push:
    branches: ['perf/**']
jobs:
  speed:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: { variant: [before, after] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Base commit's app code
        if: matrix.variant == 'before'
        shell: bash
        run: |
          BASE="${{ github.event.inputs.base }}"; [ -n "$BASE" ] || BASE=$(cat test/perf-base.txt)
          git checkout "$BASE" -- src/ && echo "before = $BASE"
      - name: Run
        shell: bash
        run: |
          D="$RUNNER_TEMP/profile"; mkdir -p "$D"; echo '{"onboarded":true}' > "$D/settings.json"
          export STUPID_SELFTEST="$RUNNER_TEMP/shot.png" STUPID_TEST_FRONT=1
          for i in 1 2 3; do
            export STUPID_PERF_LOG="$RUNNER_TEMP/start-$i.txt" STUPID_SELFTEST_STEPS="quit@6000"
            timeout 60 node_modules/electron/dist/electron.exe . --user-data-dir="$D" || true
            echo "== start $i"; cat "$STUPID_PERF_LOG" || true
          done
          export STUPID_PERF_LOG="$RUNNER_TEMP/run.txt" STUPID_SELFTEST_SCRIPT="$PWD/test/perf.js" STUPID_SELFTEST_STEPS="quit@90000"
          timeout 120 node_modules/electron/dist/electron.exe . --user-data-dir="$D" || true
          echo "== ${{ matrix.variant }}"; cat "$STUPID_PERF_LOG" || true
