# Builds the friendly installer and runs it on a real Windows machine: it must install the browser, and the screenshots
# taken while it runs are printed (base64) so they can be looked at. Runs on pushes to the installer branch.
name: Installer test
on:
  push:
    branches: [feat/clean-installer, feat/installer-disk]
    paths: ['installer/**', '.github/workflows/installer-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build the real installer
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Build the friendly installer
        shell: pwsh
        run: ./installer/build.ps1
      - name: Run it and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $full = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($full)
            $g.CopyFromScreen($b.X, $b.Y, 0, 0, $full.Size)
            $w = 900; $h = [int]($b.Height * $w / $b.Width)
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g2 = [System.Drawing.Graphics]::FromImage($bmp); $g2.InterpolationMode = 'HighQualityBicubic'; $g2.DrawImage($full, 0, 0, $w, $h)
            "SCREEN=$($b.Width)x$($b.Height)"
            $ms = New-Object System.IO.MemoryStream; $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            "SHOT-$name-BEGIN"; [Convert]::ToBase64String($ms.ToArray()); "SHOT-$name-END"
          }
          $p = Start-Process -FilePath release\StupidBrowser-Install.exe -ArgumentList "--test" -PassThru
          Start-Sleep -Milliseconds 1500; Shot "early"
          Start-Sleep -Seconds 4; Shot "middle"
          if (-not $p.WaitForExit(180000)) { "TIMEOUT"; Shot "stuck"; $p.Kill(); exit 1 }
          "EXIT=$($p.ExitCode)"
          if (Test-Path "$env:TEMP\stupid-install-error.txt") { "ERROR=" + (Get-Content "$env:TEMP\stupid-install-error.txt") }
          "LEFTOVER=" + (Get-ChildItem "$env:TEMP\StupidBrowser-Setup-*.exe" -ErrorAction SilentlyContinue | Measure-Object).Count
          $exe = "$env:LOCALAPPDATA\Programs\the-stupid-browser\StupidBrowser.exe"
          "INSTALLED=$(Test-Path $exe)"
          Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | ForEach-Object { $_.GetValue("DisplayName") + " | " + $_.GetValue("UninstallString") }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) { exit 1 }
          "--- again, over the existing install, with the browser open ---"
          $b = Start-Process -FilePath $exe -PassThru; Start-Sleep -Seconds 8
          $p2 = Start-Process -FilePath release\StupidBrowser-Install.exe -ArgumentList "--test" -PassThru
          Start-Sleep -Seconds 4; Shot "waiting"
          Get-Process StupidBrowser -ErrorAction SilentlyContinue | ForEach-Object { $_.CloseMainWindow() | Out-Null }
          Start-Sleep -Seconds 6; Get-Process StupidBrowser -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3; Shot "again"
          if (-not $p2.WaitForExit(180000)) { "TIMEOUT2"; exit 1 }
          "EXIT2=$($p2.ExitCode)"
          if ($p2.ExitCode -ne 0) { exit 1 }
          "--- fresh install with the usual disk 'full': goes on another disk ---"
          Get-PSDrive -PSProvider FileSystem | ForEach-Object { "DRIVE $($_.Name): free $([math]::Round($_.Free/1GB,1)) GB" }
          $un = (Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { $_.GetValue("DisplayName") -like "The Stupid Browser*" } | Select-Object -First 1).GetValue("UninstallString")
          "UNINSTALL=$un"
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c $un /S" -Wait
          Start-Sleep -Seconds 5; "GONE=$(-not (Test-Path $exe))"
          if (Test-Path "$env:TEMP\stupid-install-error.txt") { Remove-Item "$env:TEMP\stupid-install-error.txt" }
          $p3 = Start-Process -FilePath release\StupidBrowser-Install.exe -ArgumentList "--test","--pretend-full" -PassThru
          Start-Sleep -Milliseconds 1200; Shot "otherdisk"
          if (-not $p3.WaitForExit(180000)) { "TIMEOUT3"; exit 1 }
          "EXIT3=$($p3.ExitCode)"
          if (Test-Path "$env:TEMP\stupid-install-error.txt") { "ERROR3=" + (Get-Content "$env:TEMP\stupid-install-error.txt") }
          $found = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -ne "C" } | ForEach-Object { "$($_.Name):\The Stupid Browser\StupidBrowser.exe" } | Where-Object { Test-Path $_ }
          "OTHERDISK=$found"
          Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | ForEach-Object { $_.GetValue("DisplayName") + " | " + $_.GetValue("UninstallString") }
          if ($p3.ExitCode -ne 0 -or -not $found) { exit 1 }
