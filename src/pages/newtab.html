<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>New tab</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="newtab.css">
<link rel="stylesheet" href="widgets.css">
</head>
<body>
  <div id="bg" class="bg" aria-hidden="true"></div>
  <main>
    <div id="logo" class="logo ring"></div>
    <h1 id="wordmark" class="wordmark">The Stupid Browser</h1>
    <p id="quote" class="quote hidden" title="Click for another one"></p>
    <p class="greet"><span id="greeting">Hello</span> <span class="dotsep">·</span> <span id="clock"></span></p>
    <section id="widgets" class="widgets"></section>
    <h2 id="topHead" class="hidden">Your bookmarks</h2>
    <div id="top" class="tiles"></div>
    <p class="hint">Ctrl+T new tab · Ctrl+K command bar · Ctrl+Shift+A AI buddy · Ctrl+H history · Ctrl+, settings</p>
  </main>
  <button id="customizeBtn" class="customize-btn" title="Customize this page"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span>Customize</span></button>
  <aside id="customize" class="customize hidden" aria-label="Customize">
    <div class="cz-head"><h3 class="serif">Customize</h3><button id="czClose" class="icon-x" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="cz-label">Logo</div>
    <div class="cz-logos" id="czLogos">
      <button data-v="ring"><span class="logo ring"></span>Classic</button>
      <button data-v="emoji"><span class="logo emoji" id="czEmojiPrev">🦆</span>Emoji</button>
      <button data-v="image"><span class="logo image" id="czImgPrev"></span>Image</button>
      <button data-v="none"><span class="logo none"></span>None</button>
    </div>
    <div id="czEmojiRow" class="cz-row">
      <input id="czEmoji" class="cz-input" maxlength="16" placeholder="Type or paste an emoji">
      <div class="cz-picks" id="czPicks"></div>
    </div>
    <div id="czImageRow" class="cz-row">
      <label class="btn"><input id="czFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>Upload an image…</label>
      <small class="cz-note">Square images look best. It stays on this computer.</small>
    </div>
    <div class="cz-label">Background</div>
    <div class="cz-bgs" id="czBgs"></div>
    <div id="czDimRow" class="cz-dim"><span>Darken</span><input id="czDim" type="range" min="0" max="70" step="5"><span id="czDimVal"></span></div>
    <div class="cz-label">Title</div>
    <input id="czTitle" class="cz-input" maxlength="40" placeholder="The Stupid Browser">
    <div class="cz-label">Widgets</div>
    <div class="cz-widgets" id="czWidgets"></div>
    <label class="cz-check"><span>Random browser quotes</span><input id="czQuotes" type="checkbox" class="toggle"></label>
    <button id="czReset" class="btn cz-reset">Reset to default</button>
  </aside>
  <script src="keys.js"></script>
  <script src="common.js"></script>
  <script src="newtab.js"></script>
  <script src="widgets.js"></script>
  <script src="widget-builder.js"></script>
  <script src="background.js"></script>
</body>
</html>
