<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>History</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="lists.css">
</head>
<body>
<div class="page">
  <div class="page-head"><h1>History</h1>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><input id="q" placeholder="Search history" autofocus></div>
  </div>
  <div class="bar"><span id="selInfo" class="muted"></span><div class="grow"></div>
    <button id="delSel" class="btn small hidden">Delete selected</button>
    <a class="btn small" href="stupid://settings/#clear">Clear browsing data</a></div>
  <div id="list"></div>
  <div id="more" class="center hidden"><button class="btn" id="moreBtn">Show more</button></div>
</div>
