plugins { id 'com.android.application' }

// Release signing: keystore.properties (not in git) → storeFile, storePassword, keyAlias, keyPassword
def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.emil.stupidbrowser'
    compileSdk 36
    defaultConfig {
        applicationId 'com.emil.stupidbrowser'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.2.0'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
