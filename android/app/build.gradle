plugins { id 'com.android.application' }

// Release signing: keystore.properties (not in git) → storeFile, storePassword, keyAlias, keyPassword
def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.emil.stupidbrowser'
    compileSdk 36
    defaultConfig {
        applicationId 'com.emil.stupidbrowser'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.5.0'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
            enableV2Signing true
            enableV3Signing true   // newer signature scheme, recommended for apps outside Google Play
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs += ["$buildDir/generated/ui"] } }
}

dependencies {
    // Document-start scripts and origin-checked messaging for page helpers (what the Mac app gets from WebKit).
    implementation 'androidx.webkit:webkit:1.14.0'
}

// The browser's UI is the desktop app's own: src/ (index.html, renderer.js, pages…) and the shared core from
// mac/ (core/*.js = the Electron main process logic, js/*.js = page helpers), packed into the APK unchanged.
def ui = "$buildDir/generated/ui"
tasks.register('genCore', Exec) {
    workingDir rootProject.file('../mac')
    commandLine 'python3', 'tools/gen-core.py'
}
tasks.register('copyUi', Copy) {
    dependsOn 'genCore'
    into ui
    from(rootProject.file('../src')) { into 'shell'; exclude 'main.js', '*preload*.js', 'store.js', 'profiles.js', 'buddy-main.js', 'rewind-main.js', 'import-*.js', 'mac-*.js', 'picker*' }
    from(rootProject.file('../mac/core')) { into 'core' }
    from(rootProject.file('../mac/js')) { into 'mac' }
    from(file('ui')) { into 'android' }
}
preBuild.dependsOn 'copyUi'
