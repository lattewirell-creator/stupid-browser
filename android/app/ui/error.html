<!-- The Stupid Browser for Android: shown in place of Android's own error page when a site can't load. -->
<style>
  :root { color-scheme: light dark; --bg: #FAF9F5; --text: #1F1E1D; --muted: #6E6A62; --accent: #D97757; --line: #E6E1D6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1F1E1D; --text: #F2EFE8; --muted: #A8A399; --line: #3A3733; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; box-sizing: border-box; }
  .mark { width: 56px; height: 56px; border-radius: 50%; border: 4px solid var(--accent); display: grid; place-items: center; opacity: .85; }
  .mark span { width: 20px; height: 4px; border-radius: 4px; background: var(--accent); }
  h1 { font: 400 32px/1.15 Georgia, "Times New Roman", serif; margin: 22px 0 10px; }
  p { color: var(--muted); margin: 0 0 6px; max-width: 30em; word-break: break-word; }
  .host { color: var(--text); font-weight: 600; }
  .code { font-size: 13px; opacity: .7; margin-top: 10px; }
  button { margin-top: 26px; height: 46px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: 600 16px system-ui, sans-serif; }
</style>
<main>
  <div class="mark"><span></span></div>
  <h1>Can’t reach this page</h1>
  <p><span class="host">__HOST__</span> __WHY__</p>
  <p class="code">__CODE__</p>
  <button onclick="location.reload()">Try again</button>
</main>
